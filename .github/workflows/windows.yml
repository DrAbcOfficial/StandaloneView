name: Windows x86

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MetaHookSv/MetaHook
          path: .sdk
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A Win32 -DMETAHOOK_SOURCE_PATH="$pwd/.sdk" -DSTANDALONEVIEW_BUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX="$pwd/install"
      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
      - name: Install
        run: cmake --install build --config ${{ matrix.configuration }}
      - name: Check installed payload
        shell: pwsh
        run: |
          foreach ($file in @('plugins/StandaloneView.dll', 'plugins/StandaloneView.pdb', 'gamedata/standaloneview/index.json')) {
            if (-not (Test-Path -LiteralPath "install/svencoop/metahook/$file")) { throw "Missing $file" }
          }
          python scripts/validate-gamedata.py install/svencoop/metahook/gamedata/standaloneview --manifest scripts/manifests/standaloneview.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: StandaloneView-x86-${{ matrix.configuration }}
          path: install/svencoop
          if-no-files-found: error
